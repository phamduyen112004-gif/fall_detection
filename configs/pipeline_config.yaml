# =============================================================================
# Cấu hình Pipeline - Fall Detection
# =============================================================================
# File cấu hình cho inference pipeline
# Sử dụng: python main.py --source 0

# Giai đoạn 1: Tiền xử lý
input_size:
  width: 640
  height: 640

# Giai đoạn 2: YOLOv11-Pose
pose_model: "yolo11n-pose.pt"
min_mean_keypoint_conf: 0.2

# Giai đoạn 3: Ngưỡng góc (độ)
laydown_torso_angle_deg: 55.0
laydown_nose_ankle_angle_deg: 50.0
fall_min_frames: 60
fall_min_seconds: 10.0

# Giai đoạn 4: Telegram
telegram_bot_token: ""  # Set via env var TELEGRAM_BOT_TOKEN
telegram_chat_id: ""    # Set via env var TELEGRAM_CHAT_ID
