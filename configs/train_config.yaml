# =============================================================================
# Cấu hình Training - HybridFallTransformer
# =============================================================================
# Sử dụng: python train_transformer.py --config configs/train_config.yaml

# Data paths
data_dir: "data/processed"
out_model: "best_hybrid_transformer.pth"

# Model architecture
model:
  in_features: 60
  seq_len: 60
  d_model: 256
  nhead: 4
  num_layers: 3
  dim_feedforward: 256
  dropout: 0.1

# Training hyperparameters
training:
  epochs: 100
  batch_size: 64
  learning_rate: 0.0005
  weight_decay: 0.00001
  val_ratio: 0.2
  patience: 25
  seed: 42
  num_workers: 4

# Augmentation (per Benabdennour et al. 2026)
augmentation:
  enabled: true
  temporal_shift_prob: 0.5
  temporal_shift_max: 5
  noise_prob: 0.5
  noise_sigma: 0.01
  hflip_prob: 0.5
  seed: null

# Hardware
device: "auto"  # auto, cpu, cuda, cuda:0
